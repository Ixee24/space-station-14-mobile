name: Build Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create GitHub release with this tag (e.g. v1.0.5). Empty = build only, no release.'
        required: false
        default: ''
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Mobile Patches
        run: |
          cd space-station-14/RobustToolbox
          git apply --ignore-whitespace --whitespace=nowarn ../../patches/mobile.patch
          cd ../..
          cd space-station-14
          git apply --ignore-whitespace --whitespace=nowarn ../patches/client-fixes.patch
          cd ..

      - name: Auto bump version
        id: ver
        run: |
          INPUT_TAG="${{ inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            NEW="${INPUT_TAG#v}"
          else
            CUR=$(grep -oP '<ApplicationDisplayVersion>\K[^<]+' Content.Android/Content.Android.csproj)
            if ! echo "$CUR" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "ERROR: unexpected DisplayVersion format: $CUR" >&2
              exit 1
            fi
            NEW=$(echo "$CUR" | awk -F. '{print $1"."$2"."$3+1}')
          fi
          TAG="v$NEW"
          CODE=$(($(grep -oP '<ApplicationVersion>\K[0-9]+' Content.Android/Content.Android.csproj) + 1))
          sed -i "s|<ApplicationDisplayVersion>.*</ApplicationDisplayVersion>|<ApplicationDisplayVersion>${NEW}</ApplicationDisplayVersion>|" Content.Android/Content.Android.csproj
          sed -i "s|<ApplicationVersion>[0-9]*</ApplicationVersion>|<ApplicationVersion>${CODE}</ApplicationVersion>|" Content.Android/Content.Android.csproj
          sed -i "s|public const string CurrentAppVersion = \".*\"|public const string CurrentAppVersion = \"${TAG}\"|" Content.Android/LauncherActivity.cs
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Bumped to $TAG (versionCode $CODE)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Build Tools
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq cmake ninja-build autoconf automake libtool

      - name: Cache Native Libraries
        id: cache-natives
        uses: actions/cache@v4
        with:
          path: Content.Android/lib/arm64-v8a
          key: natives-arm64-${{ hashFiles('scripts/build-native-libs.sh') }}

      - name: Build Native Libraries from Source
        if: steps.cache-natives.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build-native-libs.sh
          ./scripts/build-native-libs.sh

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Set up Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > Content.Android/release.keystore
            echo "Keystore restored."
          else
            echo "No keystore secret configured; falling back to debug signing."
          fi

      - name: Build Android Release APK
        run: dotnet build Content.Android/Content.Android.csproj -c Release
        env:
          AndroidSigningKeyStore: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          AndroidSigningKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          AndroidSigningKeyPass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AndroidSigningStorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Find Built APK
        id: find_apk
        run: |
          APK_PATH=$(find Content.Android/bin/Release -name "*-Signed.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find Content.Android/bin/Release -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceStation14-Android-Release
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14

      - name: Release APK
        if: ${{ github.event_name == 'push' || inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || steps.ver.outputs.tag }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite: true
